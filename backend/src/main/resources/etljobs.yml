# Pipeline & ETL Job Definitions
# Links each pipeline to its DB site (dbconnections.yml) and ETL host (etlservers.yml)

pipelines:
  - pipelineKey: "CEBU-CP-DEFAULT"
    site: "CEBU-PROD"              # References dbconnections.yml
    server: "CEBU-PROD"            # References etlservers.yml
    socketPort: 60170              # DataPort Command Processor socket_port for crontab grep
    configName: "CPYQSP"           # DataPort config name for crontab grep
    senderId: 1                    # Sender ID for queue table DTP_SENDER_QUEUE_ITEM filtering
    rerunPeriodMinutes: 5          # 0 = single run, >0 = rerun after N minutes
    stages:
      - name: cp
        type: CP
        timeoutMinutes: 30
      - name: pplog
        type: PPLOG
        dependsOn: [cp]
        timeoutMinutes: 20
      - name: exensio
        type: EXENSIO
        dependsOn: [pplog]
        timeoutMinutes: 60

  - pipelineKey: "CZ4-CZ2-KLARF-DEFECT-Si"
    site: "CZ4-CZ2-PROD"
    server: "CZ4-CZ2-PROD"
    socketPort: 64566
    configName: "64566_CZ2_Defect_Klarf18_Si_Sender.xml"
    senderId: 581
    rerunPeriodMinutes: 0
    stages:
      - name: cp
        type: CP
        timeoutMinutes: 30
      - name: pplog
        type: PPLOG
        timeoutMinutes: 25
      - name: exensio
        type: EXENSIO
        dependsOn: [cp,pplog]
        timeoutMinutes: 60

  - pipelineKey: "CNK-ONSC-DEFAULT"
