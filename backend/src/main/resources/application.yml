server:
  port: 8004
  forward-headers-strategy: native

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

logging:
  level:
    root: INFO
    com.onsemi.cim.apps.exensio: INFO
    # Keep specific components at DEBUG for troubleshooting
    com.onsemi.cim.apps.exensio.controller: DEBUG
    com.onsemi.cim.apps.exensio.service.UserManagementService: DEBUG
    com.onsemi.cim.apps.exensio.service.AuditService: DEBUG
    # Reduce Hibernate SQL noise
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
  # Log file configuration (overridable per profile)
  file:
    name: logs/exensioreload.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

security:
  csp:
    relaxed: true
  # Default allowed origins (can be overridden per profile). Parsed into list by SecurityConfig.
  allowed-origins: >
    http://localhost:4200,
    http://localhost:5173

# Base refdb configuration. Per-environment overrides should be placed in
# the corresponding profile such as `application-oracle.yml`.
refdb:
  staging-table: SENDER_STAGE
  pool:
    max-size: 5
    min-idle: 1
  dispatch:
    per-send: 100
    interval-ms: 60000

exensioreload:
  dtp-db:
    yaml:
      path: classpath:dbconnections.yml

# Default mail settings (can be overridden per-profile or via env vars)
app:
  preview:
    max-rows-cap: 20000
    fetch-cap: 20000
  stage:
    page-size-cap: 20000
    max-rows-cap: 100000
    default-max-rows: 20000
  mail:
    from: "no-reply@onsemi.com"
    # default reset URL for local development; override in production
    reset-url-base:
      - http://localhost:5173/reset-password
      - http://localhost:4200/reset-password
    reset-url-probe-first: 1
    reset-url-probe-timeout-ms: 1000
  # Completion notification settings
  completion-check:
    enabled: true
    # Cron expression: every 5 minutes by default
    cron: "0 */5 * * * *"

# Optional: Dev-only local authorization bootstrap (use Liquibase in prod)
#refdb:
#  auth-bootstrap-enabled: true
#  bootstrap-admins: "fg8n8x,fg8h8x,zbqc3f,zbjzyv,fg8z8x"

# SSO (OIDC / Azure AD) configuration — all secrets via environment variables
cp:
  elasticsearch:
    url: ${CP_ES_URL:}
    api-key: ${CP_ES_API_KEY:}
    username: ${CP_ES_USERNAME:}
    password: ${CP_ES_PASSWORD:}
    index-pattern: logs*dataport*
    cp-config-filter: "*sender*"
    # Optional: set to PHO to isolate the External log source when ES contains mixed regions/services.
    service-country-filter: ${CP_ES_SERVICE_COUNTRY_FILTER:}
    # Optional: per-location ES field name overrides when different sites index the country
    # Example:
    # service-country-field-by-location:
    #   EXTERNAL-PROD: service.country
    #   EXTERNAL-QA: service_country
    #   PHM-TARLAC-PROD: service.country
    service-country-field-by-location: ${CP_ES_SERVICE_COUNTRY_FIELD_BY_LOCATION:}
    poll-interval-ms: 60000
    enrichment-timeout-minutes: 30
    logRequestPayloads: true

reloader:
  refresh:
    cookie-secure: false
    cookie-sameSite: Lax
    # Max-Age in seconds for the refresh_token cookie. 0 = session cookie (deleted on browser close).
    # 604800 = 7 days — matches the refresh token DB expiry.
    cookie-max-age: 604800
  sso:
    enabled: ${ONSEMI_SSO_ENABLED:false}
    client-id: ${ONSEMI_SSO_CLIENT_ID:}
    client-secret: ${ONSEMI_SSO_CLIENT_SECRET:}
    tenant-id: ${ONSEMI_SSO_TENANT_ID:}
    default-role: USER
    role-mappings:
      onsemi-exensioreload-admins: ADMIN
      onsemi-exensioreload-superadmins: SUPER_ADMIN

# Exensio Loading API integration — see docs/INTEGRATION_ES_EXENSIO.md
# EXENSIO_ENABLED=true + base URL activates ExensioLoadMonitor (StagePipelinePolicy).
# When disabled, post-CP routing uses ES or immediate DONE per cp.elasticsearch.url.
exensio:
  enabled: ${EXENSIO_ENABLED:false}
  env: ${EXENSIO_ENV:QA}
  qa-base-url: ${EXENSIO_QA_URL:}
  prod-base-url: ${EXENSIO_PROD_URL:}
  username: ${EXENSIO_USERNAME:}
  password: ${EXENSIO_PASSWORD:}
  dbname: ${EXENSIO_DBNAME:}
  dbschema: ${EXENSIO_DBSCHEMA:PRODUCTION}
  poll-interval-ms: 60000
  timeout-minutes: 60
  logRequestPayloads: true

  # Batch & Parallel Processing Optimization
  # batch-size: Number of lot/wafer combinations per batch API request (1-100, default: 50)
  # thread-pool-size: Number of threads for concurrent batch processing (1-20, default: 5)
  # max-concurrent-requests: Maximum concurrent API requests to Exensio (1-50, default: 10)
  # enable-circuit-breaker: Enable circuit breaker pattern (true/false, default: true)
  # circuit-breaker-threshold: Failures before opening circuit (1-100, default: 5)
  # circuit-breaker-reset-ms: Time to wait before attempting to close circuit (10000-300000, default: 60000)
  batch-size: ${EXENSIO_BATCH_SIZE:50}
  thread-pool-size: ${EXENSIO_THREAD_POOL_SIZE:5}
  max-concurrent-requests: ${EXENSIO_MAX_CONCURRENT_REQUESTS:10}
  enable-circuit-breaker: ${EXENSIO_ENABLE_CIRCUIT_BREAKER:true}
  circuit-breaker-threshold: ${EXENSIO_CIRCUIT_BREAKER_THRESHOLD:5}
  circuit-breaker-reset-ms: ${EXENSIO_CIRCUIT_BREAKER_RESET_MS:60000}

# ETL SSH Trigger — optional SSH + remote crontab (see docs/ETL_SSH_TRIGGER.md)
# Requires classpath:etlservers.yml. Independent of refdb.dispatch (queue) path.
etl:
  trigger:
    enabled: ${ETL_TRIGGER_ENABLED:false}




