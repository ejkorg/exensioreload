    # --- XFCS SPA route ---
    location ^~ /xfcs-reloader/ {
        alias /export/home/dpower/nginx/html/xfcs-reloader/;
        index index.html;
        try_files $uri $uri/ /xfcs-reloader/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

