    location ^~ /dploadmgr/assets/ {
      alias /export/home/dpower/nginx/html/dploadmgr/assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /dploadmgr/api/ {
      proxy_pass http://dploadmgr_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /dploadmgr;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    location ^~ /dploadmgr/ {
      alias /export/home/dpower/nginx/html/dploadmgr/;
      index index.html;
      try_files $uri $uri/ /dploadmgr/index.html;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://usaz15ls088 http://usaz15ls088:8080 http://usaz15ls088:8006 http://localhost:8080 http://localhost:8006 http://127.0.0.1:8080 http://127.0.0.1:8006; img-src 'self' data: blob:; script-src 'self' 'unsafe-hashes'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }



    # -------------------------------------------------------------------------
    # Error Pages
    # -------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /export/home/dpower/nginx/html; }

    location / {
      try_files $uri $uri/ =404;
    }

    # location /stdf-convert/ {
    #     # Proxy to the local Rust service running on port 3000
