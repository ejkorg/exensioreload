upstream exensioreload_backend {
  server 127.0.0.1:8004;
}

# Example server block for serving the SPA under /resender and proxying API requests
server {
  listen 8080;
  server_name usaz15ls088;

  # HTTP server for local/internal access on port 8080
  # This serves the SPA and proxies API requests without TLS so the
  # site is reachable at http://usaz15ls088:8080/exensioreload/

  # --- Safe WebAuthn stub ---
  location = /webauthnInterceptor.js {
    default_type application/javascript;
    return 200 "(function(){try{if(typeof navigator!=='undefined'){var c=navigator.credentials||{};if(typeof c.create!=='function')c.create=function(){return Promise.reject(new Error('WebAuthn not supported'));};if(typeof c.get!=='function')c.get=function(){return Promise.reject(new Error('WebAuthn not supported'));};navigator.credentials=c;}if(typeof window!=='undefined'&&typeof window.PublicKeyCredential==='undefined'){window.PublicKeyCredential=function(){};}}catch(e){}})();";
  }

  location = /exensioreload/webauthnInterceptor.js {
    default_type application/javascript;
    return 200 "(function(){try{if(typeof navigator!=='undefined'){var c=navigator.credentials||{};if(typeof c.create!=='function')c.create=function(){return Promise.reject(new Error('WebAuthn not supported'));};if(typeof c.get!=='function')c.get=function(){return Promise.reject(new Error('WebAuthn not supported'));};navigator.credentials=c;}if(typeof window!=='undefined'&&typeof window.PublicKeyCredential==='undefined'){window.PublicKeyCredential=function(){};}}catch(e){}})();";
  }

  location ~* /webauthnInterceptor\.js$ {
    default_type application/javascript;
    return 200 "(function(){try{if(typeof navigator!=='undefined'){var c=navigator.credentials||{};if(typeof c.create!=='function')c.create=function(){return Promise.reject(new Error('WebAuthn not supported'));};if(typeof c.get!=='function')c.get=function(){return Promise.reject(new Error('WebAuthn not supported'));};navigator.credentials=c;}if(typeof window!=='undefined'&&typeof window.PublicKeyCredential==='undefined'){window.PublicKeyCredential=function(){};}}catch(e){}})();";
  }

  # --- Static assets (long cache) ---
  location ^~ /exensioreload/assets/ {
    alias /export/home/dpower/nginx/html/exensioreload/assets/; # adjust path
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # --- API proxy (recommended backend handles CORS) ---
  location /exensioreload/api/ {
    proxy_pass http://exensioreload_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Ensure Authorization header is forwarded to the backend
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /exensioreload;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Optional: if you want cookies scoped to the SPA path
    # proxy_cookie_path / /exensioreload/;
  }

  # --- SPA route ---
  # Use `alias` here to avoid duplicating the `/resender` path when resolving files.
  # With `root /.../resender/` a request for `/resender/` maps to
  # `/.../resender/resender/index.html` which causes errors. `alias` strips the
  # location prefix and maps correctly to the filesystem below.
  location ^~ /exensioreload/ {
    alias /export/home/dpower/nginx/html/exensioreload/; # adjust path
    index index.html;
    try_files $uri $uri/ /exensioreload/index.html;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://usaz15ls088 http://usaz15ls088:8080 http://usaz15ls088:8004 http://localhost:8080 http://localhost:8004 http://127.0.0.1:8080 http://127.0.0.1:8004; img-src 'self' data: blob:; script-src 'self' 'unsafe-hashes'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
  }

  # Security headers (adjust to taste)
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
