<div class="app-shell" [class.authenticated]="auth.user$ | async">
  <!-- Hub Header -->
  <header class="hub-header" *ngIf="auth.isInitialized() && (auth.user$ | async) as user">
    <div class="header-left">
      <div class="brand">
        <img src="assets/brand-logo.svg" alt="ExensioReload logo" class="brand-logo" width="24" height="24" />
        <span class="brand-text"><span class="accent">ExensioReload</span></span>
        <span class="v-tag">v1</span>
      </div>
    </div>

    <div class="header-right">
      <nav class="hub-nav" *ngIf="auth.user$ | async">
        <ng-container *ngFor="let item of navItems">
          <!-- Regular menu item -->
          <a
            *ngIf="(!item.admin || auth.isAdmin()) && !item.submenu"
            [routerLink]="[item.path]"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            class="nav-link"
            [class.nav-link-loading]="loadingNavPath() === item.path"
            (click)="closeMenus()"
          >
            <app-glass-icon [name]="item.icon" [size]="18"></app-glass-icon>
            <span class="nav-label">{{ item.label }}</span>
            <span
              *ngIf="item.path === '/my-sessions' && activeSessionCount() > 0"
              class="nav-badge"
              [attr.aria-label]="activeSessionCount() + ' active sessions'"
              >{{ activeSessionCount() }}</span
            >
            <span *ngIf="loadingNavPath() === item.path" class="nav-item-spinner"></span>
          </a>

          <!-- Admin Submenu Dropdown -->
          <div *ngIf="item.submenu && (!item.admin || auth.isAdmin())" class="nav-submenu-wrapper">
            <button
              type="button"
              class="nav-link nav-submenu-toggle"
              (click)="toggleAdminMenu()"
              [class.active]="adminMenuExpanded()"
              [attr.aria-expanded]="adminMenuExpanded()"
              aria-label="Admin menu"
            >
              <app-glass-icon [name]="item.icon" [size]="18"></app-glass-icon>
              <span class="nav-label">{{ item.label }}</span>
              <app-glass-icon
                name="expand_more"
                [size]="16"
                class="submenu-arrow"
                [class.expanded]="adminMenuExpanded()"
              ></app-glass-icon>
            </button>

            <!-- Submenu Dropdown Panel -->
            <div class="nav-submenu-panel" [class.expanded]="adminMenuExpanded()">
              <div class="submenu-header">
                <span class="submenu-title">Admin Tools</span>
              </div>
              <div class="submenu-items">
                <ng-container *ngFor="let child of item.children">
                  <a
                    *ngIf="!child.superAdmin || auth.isSuperAdmin()"
                    [routerLink]="[child.path]"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: false }"
                    class="submenu-link"
                    [class.nav-link-loading]="loadingNavPath() === child.path"
                    (click)="adminMenuExpanded.set(false)"
                  >
                    <app-glass-icon [name]="child.icon" [size]="16"></app-glass-icon>
                    <span class="submenu-label">{{ child.label }}</span>
                    <span *ngIf="loadingNavPath() === child.path" class="nav-item-spinner"></span>
                  </a>
                </ng-container>
              </div>
            </div>
          </div>
        </ng-container>
      </nav>

      <a
        href="http://usaz15ls088:8080/exensio-integration-hub/"
        target="_blank"
        rel="noopener noreferrer"
        class="hub-link"
        title="Go to Integration Hub"
      >
        <app-glass-icon name="home" [size]="16"></app-glass-icon>
        <span class="hub-link-label">Hub</span>
      </a>

      <!-- User Display & Actions -->
      <div class="user-info-display">
        <span class="username-display">{{ user.username }}</span>
      </div>

      <button
        type="button"
        class="icon-btn theme-toggle-btn"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <app-glass-icon
          [name]="themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode'"
          [size]="18"
        ></app-glass-icon>
      </button>

      <button type="button" class="icon-btn logout-btn" (click)="logout()" aria-label="Sign out" title="Sign out">
        <app-glass-icon name="logout" [size]="18"></app-glass-icon>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <div class="main-shell" [class.no-header]="!(auth.user$ | async)" [class.no-sidebar]="true">
    <main class="hub-main">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Toast Notifications -->
  <app-toast-container></app-toast-container>

  <!-- AI Chat Assistant -->
  <app-ai-chat></app-ai-chat>

  <div class="glow-orb orb-1" aria-hidden="true"></div>
  <div class="glow-orb orb-2" aria-hidden="true"></div>
</div>
