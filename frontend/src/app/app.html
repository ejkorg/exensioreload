<div class="app-shell" [class.authenticated]="auth.user$ | async">
  <!-- Hub Header -->
  <header class="hub-header" *ngIf="auth.isInitialized() && (auth.user$ | async) as user">
    <div class="header-left">
      <div class="brand">
        <span class="material-icons brand-logo" aria-hidden="true">account_tree</span>
        <span class="brand-text"><span class="accent">ExensioReload</span></span>
        <span class="v-tag">v1</span>
      </div>
    </div>

    <div class="header-right">
      <nav class="hub-nav" *ngIf="auth.user$ | async">
        <ng-container *ngFor="let item of navItems">
          <!-- Regular menu item -->
          <a
            *ngIf="(!item.admin || auth.isAdmin()) && !item.submenu; else adminMenu"
            [routerLink]="[item.path]"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            class="nav-link"
            [class.nav-link-loading]="loadingNavPath() === item.path"
          >
            <app-glass-icon [name]="item.icon" [size]="18"></app-glass-icon>
            <span class="nav-label">{{ item.label }}</span>
            <span
              *ngIf="item.path === '/my-sessions' && activeSessionCount() > 0"
              class="nav-badge"
              [attr.aria-label]="activeSessionCount() + ' active sessions'"
              >{{ activeSessionCount() }}</span
            >
            <span *ngIf="loadingNavPath() === item.path" class="nav-item-spinner"></span>
          </a>

          <!-- Submenu item (Admin) -->
          <div *ngIf="item.submenu && (!item.admin || auth.isAdmin())" class="nav-submenu-wrapper">
            <button
              type="button"
              class="nav-link nav-submenu-toggle"
              (click)="toggleAdminMenu()"
              [class.active]="adminMenuExpanded()"
            >
              <app-glass-icon [name]="item.icon" [size]="18"></app-glass-icon>
              <span class="nav-label">{{ item.label }}</span>
              <span class="material-icons submenu-arrow" [class.expanded]="adminMenuExpanded()"> expand_more </span>
            </button>

            <!-- Submenu items -->
            <div class="nav-submenu" [class.expanded]="adminMenuExpanded()">
              <a
                *ngFor="let child of item.children"
                [ngIf]="!child.superAdmin || auth.isSuperAdmin()"
                [routerLink]="[child.path]"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: false }"
                class="nav-submenu-link"
                [class.nav-link-loading]="loadingNavPath() === child.path"
              >
                <app-glass-icon [name]="child.icon" [size]="16"></app-glass-icon>
                <span class="nav-label">{{ child.label }}</span>
                <span *ngIf="loadingNavPath() === child.path" class="nav-item-spinner"></span>
              </a>
            </div>
          </div>
        </ng-container>
      </nav>

      <a
        href="http://usaz15ls088:8080/exensio-integration-hub/"
        target="_blank"
        rel="noopener noreferrer"
        class="hub-link"
        title="Go to Integration Hub"
      >
        <span class="material-icons">home</span>
        <span class="hub-link-label">Hub</span>
      </a>

      <div class="user-info">
        <span class="username">{{ user.username }}</span>
        <button
          class="theme-toggle"
          (click)="themeService.toggleTheme()"
          [title]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <span class="toggle-track" [class.is-dark]="themeService.theme() === 'dark'">
            <span class="toggle-thumb">
              <span class="material-icons toggle-thumb-icon"
                >{{ themeService.theme() === 'dark' ? 'dark_mode' : 'light_mode' }}</span
              >
            </span>
          </span>
        </button>
        <button type="button" (click)="logout()" title="Logout" class="icon-btn logout-btn" aria-label="Logout">
          <span class="material-icons">logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <div class="main-shell" [class.no-header]="!(auth.user$ | async)" [class.no-sidebar]="true">
    <main class="hub-main">
      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Toast Notifications -->
  <app-toast-container></app-toast-container>

  <!-- AI Chat Assistant -->
  <app-ai-chat></app-ai-chat>

  <div class="glow-orb orb-1" aria-hidden="true"></div>
  <div class="glow-orb orb-2" aria-hidden="true"></div>
</div>
