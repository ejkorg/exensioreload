<div class="db-connection-form-dialog">
  <div class="dialog-header">
    <h2>{{ mode === 'create' ? 'Create New' : 'Edit' }} Database Connection</h2>
    <button class="close-btn" (click)="cancel()" type="button" aria-label="Close">
      <app-glass-icon name="close"></app-glass-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-content">
    <!-- Connection Key Section -->
    <fieldset class="form-section">
      <legend>Basic Information</legend>

      <app-glass-input
        label="Connection Key"
        placeholder="e.g., CEBU_ORACLE_PROD"
        formControlName="connectionKey"
        prefixIcon="label"
        [disabled]="mode === 'edit' || loading()"
        [error]="getConnectionKeyError() || null"
      ></app-glass-input>

      <div class="form-row">
        <app-glass-select
          label="Database Type"
          placeholder="Select type"
          formControlName="dbType"
          prefixIcon="database"
          [options]="dbTypes"
          [disabled]="mode === 'edit' || loading()"
          [error]="form.get('dbType')?.invalid ? 'Database type is required' : null"
        ></app-glass-select>

        <app-glass-select
          label="Environment"
          placeholder="Select environment"
          formControlName="environment"
          prefixIcon="tune"
          [options]="environments"
          [disabled]="loading()"
          [error]="form.get('environment')?.invalid ? 'Environment is required' : null"
        ></app-glass-select>
      </div>
    </fieldset>

    <!-- Connection Details Section -->
    <fieldset class="form-section">
      <legend>Connection Details</legend>

      <app-glass-input
        label="Host"
        placeholder="e.g., oracle-db.example.com"
        formControlName="host"
        prefixIcon="dns"
        [disabled]="loading()"
        [error]="getHostError() || null"
      ></app-glass-input>

      <div class="form-row">
        <app-glass-input
          label="Schema"
          placeholder="e.g., EXENSIO_DB"
          formControlName="schema"
          prefixIcon="table"
          [disabled]="loading()"
          [error]="getSchemaError() || null"
        ></app-glass-input>

        <app-glass-input
          label="User"
          placeholder="e.g., exensio_user"
          formControlName="user"
          prefixIcon="person"
          [disabled]="loading()"
          [error]="getUserError() || null"
        ></app-glass-input>
      </div>

      <app-glass-input
        label="Password"
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="Enter database password"
        formControlName="encryptedPassword"
        prefixIcon="vpn_key"
        [suffixIcon]="showPassword() ? 'visibility_off' : 'visibility'"
        (suffixAction)="showPassword.set(!showPassword())"
        [disabled]="loading()"
        [error]="getPasswordError() || null"
      ></app-glass-input>
    </fieldset>

    <!-- Hikari Pool Settings Section -->
    <fieldset class="form-section">
      <legend>Connection Pool Settings (Hikari)</legend>

      <div class="form-row">
        <app-glass-input
          label="Connection Timeout (ms)"
          type="number"
          placeholder="30000"
          formControlName="connectionTimeoutMs"
          prefixIcon="schedule"
          [disabled]="loading()"
          [error]="getTimeoutError() || null"
        ></app-glass-input>

        <app-glass-input
          label="Maximum Pool Size"
          type="number"
          placeholder="10"
          formControlName="maximumPoolSize"
          prefixIcon="lan"
          [disabled]="loading()"
          [error]="getMaxPoolSizeError() || null"
        ></app-glass-input>

        <app-glass-input
          label="Minimum Idle"
          type="number"
          placeholder="5"
          formControlName="minimumIdle"
          prefixIcon="sensors"
          [disabled]="loading()"
          [error]="getMinIdleError() || null"
        ></app-glass-input>
      </div>

      <div *ngIf="getPoolSizeError()" class="error-message form-wide">
        {{ getPoolSizeError() }}
      </div>
    </fieldset>

    <!-- Optional Settings Section -->
    <fieldset class="form-section">
      <legend>Optional Settings</legend>

      <app-glass-input
        label="Download URL"
        type="url"
        placeholder="https://example.com/download"
        formControlName="downloadUrl"
        prefixIcon="link"
        [disabled]="loading()"
      ></app-glass-input>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="enabled" [disabled]="loading()" />
          <span>Enabled</span>
        </label>
        <p class="help-text">Uncheck to disable this connection without deleting it</p>
      </div>
    </fieldset>

    <!-- Form Actions -->
    <div class="form-actions">
      <button
        type="button"
        class="glass-btn secondary"
        (click)="testConnection()"
        [disabled]="form.invalid || loading() || testingConnection()"
      >
        <app-glass-icon name="link_check"></app-glass-icon>
        {{ testingConnection() ? 'Testing...' : 'Test Connection' }}
      </button>

      <div class="spacer"></div>

      <button type="button" class="glass-btn secondary" (click)="cancel()" [disabled]="loading()">Cancel</button>

      <button
        type="submit"
        class="glass-btn primary"
        [disabled]="form.invalid || submitting() || loading() || testingConnection()"
      >
        <app-glass-icon name="save"></app-glass-icon>
        {{ submitting() ? 'Saving...' : mode === 'create' ? 'Create Connection' : 'Update Connection' }}
      </button>
    </div>
  </form>
</div>
